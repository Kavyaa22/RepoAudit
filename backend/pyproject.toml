[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoaudit"
version = "0.4.0"
description = "Codebase understanding, auditing, and investigation platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = [
    "audit", "documentation", "codebase", "code-analysis", "security",
    "repository", "ai", "llm", "developer-tools", "investigation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "reportlab>=4.0",
    "vulture>=2.10",
    "bandit>=1.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "supabase>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
repoaudit = "repoaudit.interfaces.cli.cli:cli"

[project.urls]
Homepage = "https://github.com/he-yufeng/RepoAudit"
Repository = "https://github.com/he-yufeng/RepoAudit"
Issues = "https://github.com/he-yufeng/RepoAudit/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"src/repoaudit" = "repoaudit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
